settings:
  spotify:
    token_url: https://accounts.spotify.com/api/token
    search_url: https://api.spotify.com/v1/search
    search_types:
      - track
    # Matriz de búsqueda: término × año. Escala a 200k-500k ampliando esta lista.
    # LÍMITE VERIFICADO 2026-09-15: esta app rechaza limit>10 con 400 "Invalid limit"
    # (probado: 10 OK, 20 FAIL). No subir sin re-probar.
    # Techo por query: limit(10) × max_pages(50) = 500 (offsets 0-490, bajo el cap 1000).
    # 10 términos × 8 años × 500 = 40k máx/corrida full (únicos reales ~20-30k).
    query_terms:
      - techno
      - house
      - trance
      - edm
      - dance
      - electro
      - progressive
      - minimal
      - tech-house
      - melodic techno
      - guaracha
      - afro house
    limit: 10
    max_pages: 50
    sleep_seconds: 1

  project:
    start_year: 2018
    end_year: 2025
    # Refresh diario: solo estos últimos N años (barato). Full semanal: todo.
    recent_years: 3
    # 0 = sin filtro. Subir a 20-30 para quedarse con tracks relevantes.
    min_popularity: 0

  mongodb:
    database: spotify_electronica_colombia
    raw_collection: raw_search_results
    curated_collection: curated_tracks
    runs_collection: ingestion_runs
